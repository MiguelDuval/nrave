name: One-time AUX Sampler recovery
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
jobs:
  fix-and-build:
    if: ${{ !contains(github.event.head_commit.message, 'AUX/Sampler recovery applied') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch Android AUX and Sampler test path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('res/skins/LateNightQML/main.qml')
          text = main.read_text()

          marker = 'import "LateNightTheme"\n'
          imports = 'import "LateNightTheme"\nimport "MicAux" as LateNightMicAux\nimport "Samplers" as LateNightSamplers\n'
          if 'import "MicAux" as LateNightMicAux' not in text:
              text = text.replace(marker, imports, 1)

          bar = '        width: 283\n'
          if 'NRAVE_AUX_SAMPLER_DIRECT_TEST_V1' not in text:
              text = text.replace(
                  bar,
                  '        // NRAVE_AUX_SAMPLER_DIRECT_TEST_V1\n        width: 472\n',
                  1,
              )
              end = '''            }\n        }\n    }\n\n    // Android-only direct rack surfaces.'''
              replacement = '''            }\n\n            Rectangle {\n                id: auxDirectTestButton\n                color: mobileShowMicAuxControl.value > 0.5\n                        ? LateNightTheme.toolbarButtonActiveBackgroundColor\n                        : LateNightTheme.toolbarButtonInactiveBackgroundColor\n                height: parent.height\n                radius: 2\n                width: 89\n\n                Text {\n                    anchors.fill: parent\n                    color: LateNightTheme.toolbarButtonInactiveTextColor\n                    font.family: "Open Sans"\n                    font.pixelSize: 12\n                    font.bold: true\n                    horizontalAlignment: Text.AlignHCenter\n                    verticalAlignment: Text.AlignVCenter\n                    text: "AUX TEST"\n                }\n\n                MouseArea {\n                    anchors.fill: parent\n                    onClicked: mobileShowMicAuxControl.value = mobileShowMicAuxControl.value > 0.5 ? 0.0 : 1.0\n                }\n            }\n\n            Rectangle {\n                id: samplerDirectTestButton\n                color: mobileShowSamplersControl.value > 0.5\n                        ? LateNightTheme.toolbarButtonActiveBackgroundColor\n                        : LateNightTheme.toolbarButtonInactiveBackgroundColor\n                height: parent.height\n                radius: 2\n                width: 89\n\n                Text {\n                    anchors.fill: parent\n                    color: LateNightTheme.toolbarButtonInactiveTextColor\n                    font.family: "Open Sans"\n                    font.pixelSize: 12\n                    font.bold: true\n                    horizontalAlignment: Text.AlignHCenter\n                    verticalAlignment: Text.AlignVCenter\n                    text: "SAMPLER TEST"\n                }\n\n                MouseArea {\n                    anchors.fill: parent\n                    onClicked: mobileShowSamplersControl.value = mobileShowSamplersControl.value > 0.5 ? 0.0 : 1.0\n                }\n            }\n        }\n    }\n\n    // Android-only direct rack surfaces.'''
              if end not in text:
                  raise SystemExit('mobile strip insertion anchor not found')
              text = text.replace(end, replacement, 1)
          main.write_text(text)

          build = Path('.github/workflows/build.yml')
          b = build.read_text()
          old = '''          main_text = main_qml.read_text()\n          main_text = main_text.replace('import "MicAux" as LateNightMicAux\\n', '', 1)\n          main_text = main_text.replace('import "Samplers" as LateNightSamplers\\n', '', 1)\n'''
          new = '''          main_text = main_qml.read_text()\n          # Keep the direct rack imports: main.qml owns the Android rack surfaces.\n'''
          if old not in b:
              raise SystemExit('build workflow import-removal block not found')
          build.write_text(b.replace(old, new, 1))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add res/skins/LateNightQML/main.qml .github/workflows/build.yml
          git commit -m 'fix: AUX/Sampler recovery applied' || true
          git push origin HEAD:main

      - name: Dispatch Android build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml --ref main

      - name: Remove one-time fixer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-aux-sampler-recovery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-time AUX/Sampler recovery workflow'
          git push origin HEAD:main
