name: Dispatch Android APK after rescue run

on:
  workflow_run:
    workflows:
      - "Android APK"
      - ".github/workflows/build.yml"
    types: [completed]

permissions:
  actions: write

jobs:
  dispatch:
    if: ${{ github.event.workflow_run.id == 34904885397 }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current main Android build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches" \
            -d '{"ref":"main"}'
