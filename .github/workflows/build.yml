name: Android APK
# CI validation is intentionally triggered by branch pushes for design work.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - experimental/modern-indicator-skin
      - experimental/modern-indicator-skin-2
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
env:
  DEBIAN_FRONTEND: noninteractive
jobs:
  validate-nrave-splash:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate historical NRave splash chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, struct

          src = sorted(Path("packaging/android/icon-source").glob("nrave_splash.webp.b64.part*"))
          src = sorted(src, key=lambda p: int(p.name.rsplit("part", 1)[1]))
          text = [p.read_text().strip() for p in src]

          def decode_padded(value: str) -> bytes:
              value = "".join(value.split())
              value += "=" * ((-len(value)) % 4)
              return base64.b64decode(value, validate=True)

          concat = decode_padded("".join(text))
          independent = b"".join(decode_padded(x) for x in text)

          for name, data in [("concat-base64", concat), ("independent-chunks", independent)]:
              print(name, "bytes", len(data), "sha256", hashlib.sha256(data).hexdigest(), "header", data[:16])
              if data[:4] == b"RIFF" and data[8:12] == b"WEBP":
                  size = struct.unpack("<I", data[4:8])[0] + 8
                  print(name, "riff_size", size)
          PY

  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Materialize NRave launcher and splash artwork
        shell: bash
        run: |
          set -euo pipefail

          # --- NRave launcher icon ---
          SRC="packaging/android/icon-source/ic_launcher.png.b64"
          DST_DIR="packaging/android/res/mipmap-xxxhdpi"
          DST="$DST_DIR/nrave_icon.png"
          mkdir -p "$DST_DIR"
          find "$DST_DIR" -type f -delete
          tr -d '\r\n\t ' < "$SRC" | base64 --decode > "$DST"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct, zlib

          p = Path("packaging/android/res/mipmap-xxxhdpi/nrave_icon.png")
          d = p.read_bytes()
          if not d.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("Invalid NRave launcher PNG signature")
          pos = 8
          seen_ihdr = seen_iend = False
          while pos < len(d):
              if pos + 12 > len(d):
                  raise SystemExit("Truncated PNG chunk header")
              n = struct.unpack(">I", d[pos:pos+4])[0]
              typ = d[pos+4:pos+8]
              endpos = pos + 12 + n
              if endpos > len(d):
                  raise SystemExit(f"Truncated PNG chunk {typ!r}")
              payload = d[pos+8:pos+8+n]
              crc = struct.unpack(">I", d[pos+8+n:endpos])[0]
              if (zlib.crc32(typ + payload) & 0xffffffff) != crc:
                  raise SystemExit(f"Invalid PNG CRC in {typ.decode('latin1')}")
              if typ == b"IHDR":
                  if n != 13:
                      raise SystemExit("Invalid IHDR length")
                  width, height, _, _, comp, filt, _ = struct.unpack(">IIBBBBB", payload)
                  if (width, height) != (144, 144):
                      raise SystemExit(f"Launcher PNG must be 144x144, got {width}x{height}")
                  if comp != 0 or filt != 0:
                      raise SystemExit("Unsupported PNG compression/filter method")
                  seen_ihdr = True
              if typ == b"IEND":
                  if n != 0 or endpos != len(d):
                      raise SystemExit("Invalid PNG IEND/trailing data")
                  seen_iend = True
                  break
              pos = endpos
          if not seen_ihdr or not seen_iend:
              raise SystemExit("PNG missing IHDR or IEND")
          print(f"Validated NRave launcher artwork: {len(d)} bytes, 144x144, SHA-256 {hashlib.sha256(d).hexdigest()}")
          PY

          # --- NRave full-screen QML artwork ---
          # The production splash is a committed Qt resource. Keeping the
          # artwork inside the application resource system avoids the Android
          # external-storage timing window that previously produced a black
          # frame after the permission dialog.
          SPLASH="res/images/nrave_splash.webp"
          test -f "$SPLASH"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path("res/images/nrave_splash.webp")
          data = p.read_bytes()
          expected = "5a0b11f7243c239695adcb5c3278d636ed167c44757c0399d547f3933aff9b4b"
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f"NRave splash SHA-256 mismatch: {actual}")
          if not data.startswith(b"RIFF") or data[8:12] != b"WEBP":
              raise SystemExit("Invalid NRave splash WebP signature")
          print(f"Validated NRave splash artwork: {len(data)} bytes, SHA-256 {expected}")
          PY

          # Only encoded/helper sources are forbidden in packaged Android resources.
          if find packaging/android/res -type f \( -name '*.b64' -o -name '*.part*' \) | grep -q .; then
            echo 'ERROR: source/helper files must not be present under packaging/android/res'
            exit 1
          fi
      - name: Prepare Android build environment
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get clean
          source ./tools/android_buildenv.sh setup
      - name: Create temporary signing key
        shell: bash
        run: |
          PASS="mixxx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          keytool -genkeypair -keystore "$RUNNER_TEMP/mixxx.keystore" -alias mixxx -keyalg RSA -keysize 2048 -validity 3650 -storepass "$PASS" -keypass "$PASS" -dname "CN=Mixxx Android Build"
          echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_KEY_PASS=$PASS" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_STORE_PASS=$PASS" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mixxx.keystore" >> "$GITHUB_ENV"
      - name: Configure Android
        shell: bash
        run: |
          set -o pipefail
          rm -rf build-android "${BUILDENV_BASEPATH}/${BUILDENV_NAME}"
          mkdir -p build-android
          for attempt in 1 2 3; do
            rm -rf "${BUILDENV_BASEPATH}/${BUILDENV_NAME}" build-android
            mkdir -p build-android
            if (cd build-android && cmake -DCMAKE_TOOLCHAIN_FILE="${MIXXX_VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" -DCMAKE_SYSTEM_NAME=Android -DBUILD_TESTING=OFF -DBUILD_BENCH=OFF ..); then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Build APK only
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-android --target apk --parallel 2 --verbose 2>&1 | tee "$RUNNER_TEMP/android-apk-build.log"
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-build-log
          path: ${{ runner.temp }}/android-apk-build.log
          archive: true
          if-no-files-found: error
          retention-days: 14
      - name: Verify APK
        shell: bash
        run: |
          test -f build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          ls -lh build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
      - name: Print source and APK identity
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_COMMIT=${GITHUB_SHA}"
          sha256sum build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nrave-android-${{ github.sha }}
          path: build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
