name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
env:
  DEBIAN_FRONTEND: noninteractive
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Integrate mobile AUX and Samplers into MainWindow layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          marker = "// NRAVE_MOBILE_AUX_SAMPLER_INTEGRATION_V1"
          main_window = Path("res/skins/LateNightQML/MainWindow.qml")
          main_qml = Path("res/skins/LateNightQML/main.qml")
          text = main_window.read_text()

          if marker not in text:
              text = text.replace(
                  'import "Effects" as LateNightEffects\n',
                  'import "Effects" as LateNightEffects\nimport "MicAux" as LateNightMicAux\n',
                  1,
              )
              text = text.replace(
                  '    readonly property real requiredPaneHeight: basePaneHeight + effectsSection.height + samplersSection.height\n',
                  '    readonly property real requiredPaneHeight: basePaneHeight + effectsSection.height + samplersSection.height + micAuxSection.height\n',
                  1,
              )
              anchor = '''                Item {\n                    id: samplersSection\n\n                    clip: true\n                    height: root.showSamplers && !root.maximizeLibrary ? samplers.implicitHeight : 0\n                    opacity: root.showSamplers && !root.maximizeLibrary ? 1 : 0\n                    visible: height > 0\n                    width: parent.width\n                    y: effectsSection.y + effectsSection.height\n                    z: 2\n\n                    Behavior on height {\n                        NumberAnimation {\n                            duration: 150\n                            easing.type: Easing.OutCubic\n                        }\n                    }\n                    Behavior on opacity {\n                        NumberAnimation {\n                            duration: 120\n                        }\n                    }\n\n                    LateNightSamplers.SamplersRack {\n                        id: samplers\n\n                        anchors.left: parent.left\n                        anchors.right: parent.right\n                        anchors.top: parent.top\n                    }\n                }\n                Loader {\n                    id: library\n'''
              replacement = '''                Item {\n                    id: samplersSection\n\n                    clip: true\n                    height: root.showSamplers && !root.maximizeLibrary ? Math.max(samplers.implicitHeight, 360) : 0\n                    opacity: root.showSamplers && !root.maximizeLibrary ? 1 : 0\n                    visible: height > 0\n                    width: parent.width\n                    y: effectsSection.y + effectsSection.height\n                    z: 2\n\n                    Behavior on height {\n                        NumberAnimation {\n                            duration: 150\n                            easing.type: Easing.OutCubic\n                        }\n                    }\n                    Behavior on opacity {\n                        NumberAnimation {\n                            duration: 120\n                        }\n                    }\n\n                    LateNightSamplers.SamplersRack {\n                        id: samplers\n\n                        anchors.fill: parent\n                    }\n                }\n                Item {\n                    id: micAuxSection\n\n                    clip: true\n                    height: root.showMicAux && !root.maximizeLibrary ? Math.max(micAuxRack.implicitHeight, 180) : 0\n                    opacity: root.showMicAux && !root.maximizeLibrary ? 1 : 0\n                    visible: height > 0\n                    width: parent.width\n                    y: samplersSection.y + samplersSection.height\n                    z: 2\n\n                    Behavior on height {\n                        NumberAnimation {\n                            duration: 150\n                            easing.type: Easing.OutCubic\n                        }\n                    }\n                    Behavior on opacity {\n                        NumberAnimation {\n                            duration: 120\n                        }\n                    }\n\n                    LateNightMicAux.MicAuxRack {\n                        id: micAuxRack\n\n                        anchors.fill: parent\n                    }\n                }\n                Loader {\n                    id: library\n'''
              if anchor not in text:
                  raise SystemExit("Sampler section anchor not found in MainWindow.qml")
              text = text.replace(anchor, replacement, 1)
              text = text.replace(marker, marker, 1) if marker in text else text.replace(
                  'Item {\n    id: root\n',
                  'Item {\n    id: root\n\n    ' + marker + '\n',
                  1,
              )
              main_window.write_text(text)

          main_text = main_qml.read_text()
          main_text = main_text.replace('import "MicAux" as LateNightMicAux\n', '', 1)
          main_text = main_text.replace('import "Samplers" as LateNightSamplers\n', '', 1)
          overlay_block = '''    // Android-safe overlays. They consume the same functional racks already\n    // used by the skin, but are positioned independently of desktop SplitView\n    // geometry. Visibility follows the toolbar's actual UI state.\n    LateNightMicAux.MicAuxOverlay {\n        id: micAuxOverlay\n        anchors.left: parent.left\n        anchors.right: parent.right\n        anchors.top: parent.top\n        anchors.topMargin: 62\n        show: mainWindowLoader.item ? mainWindowLoader.item.showMicAux : false\n    }\n\n    LateNightSamplers.SamplersOverlay {\n        id: samplersOverlay\n        anchors.left: parent.left\n        anchors.right: parent.right\n        anchors.top: parent.top\n        anchors.topMargin: 62\n        show: mainWindowLoader.item ? mainWindowLoader.item.showSamplers : false\n    }\n\n'''
          if overlay_block in main_text:
              main_text = main_text.replace(overlay_block, '', 1)
          main_qml.write_text(main_text)

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          if subprocess.run(["git", "diff", "--quiet"], check=False).returncode == 0:
              print("Mobile AUX/Sampler integration already present; no source patch required.")
              raise SystemExit(0)
          subprocess.run(["git", "add", "res/skins/LateNightQML/MainWindow.qml", "res/skins/LateNightQML/main.qml"], check=True)
          subprocess.run(["git", "commit", "-m", "fix(android): integrate AUX and Samplers into MainWindow layout [skip ci]"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          subprocess.run(["git", "reset", "--hard", "origin/main"], check=True)
          print("Applied and persisted MainWindow integration; build continues from patched main.")
          PY
      - name: Materialize NRave launcher artwork
        shell: bash
        run: |
          set -euo pipefail
          SRC="packaging/android/icon-source/ic_launcher.png.b64"
          DST_DIR="packaging/android/res/mipmap-xxxhdpi"
          DST="$DST_DIR/nrave_icon.png"
          mkdir -p "$DST_DIR"
          find "$DST_DIR" -type f -delete
          tr -d '\r\n\t ' < "$SRC" | base64 --decode > "$DST"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct, zlib
          p = Path("packaging/android/res/mipmap-xxxhdpi/nrave_icon.png")
          d = p.read_bytes()
          if not d.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("Invalid NRave launcher PNG signature")
          pos = 8
          seen_ihdr = seen_iend = False
          while pos < len(d):
              if pos + 12 > len(d):
                  raise SystemExit("Truncated PNG chunk header")
              n = struct.unpack(">I", d[pos:pos+4])[0]
              typ = d[pos+4:pos+8]
              endpos = pos + 12 + n
              if endpos > len(d):
                  raise SystemExit(f"Truncated PNG chunk {typ!r}")
              payload = d[pos+8:pos+8+n]
              crc = struct.unpack(">I", d[pos+8+n:endpos])[0]
              if (zlib.crc32(typ + payload) & 0xffffffff) != crc:
                  raise SystemExit(f"Invalid PNG CRC in {typ.decode('latin1')}")
              if typ == b"IHDR":
                  if n != 13:
                      raise SystemExit("Invalid IHDR length")
                  width, height, bit_depth, color_type, comp, filt, interlace = struct.unpack(">IIBBBBB", payload)
                  if (width, height) != (144, 144):
                      raise SystemExit(f"Launcher PNG must be 144x144, got {width}x{height}")
                  if comp != 0 or filt != 0:
                      raise SystemExit("Unsupported PNG compression/filter method")
                  seen_ihdr = True
              if typ == b"IEND":
                  if n != 0 or endpos != len(d):
                      raise SystemExit("Invalid PNG IEND/trailing data")
                  seen_iend = True
                  break
              pos = endpos
          if not seen_ihdr or not seen_iend:
              raise SystemExit("PNG missing IHDR or IEND")
          print(f"Validated NRave launcher artwork: {len(d)} bytes, 144x144, SHA-256 {hashlib.sha256(d).hexdigest()}")
          PY
          if find packaging/android/res -type f \( -name '*.b64' -o -name '*.part*' -o -name '*.webp' \) | grep -q .; then
            echo 'ERROR: source/helper files must not be present under packaging/android/res'
            exit 1
          fi
      - name: Prepare Android build environment
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get clean
          source ./tools/android_buildenv.sh setup
      - name: Create temporary signing key
        shell: bash
        run: |
          PASS="mixxx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          keytool -genkeypair -keystore "$RUNNER_TEMP/mixxx.keystore" -alias mixxx -keyalg RSA -keysize 2048 -validity 3650 -storepass "$PASS" -keypass "$PASS" -dname "CN=Mixxx Android Build"
          echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_KEY_PASS=$PASS" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_STORE_PASS=$PASS" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mixxx.keystore" >> "$GITHUB_ENV"
      - name: Configure Android
        shell: bash
        run: |
          set -o pipefail
          rm -rf build-android "${BUILDENV_BASEPATH}/${BUILDENV_NAME}"
          mkdir -p build-android
          for attempt in 1 2 3; do
            rm -rf "${BUILDENV_BASEPATH}/${BUILDENV_NAME}" build-android
            mkdir -p build-android
            if (cd build-android && cmake -DCMAKE_TOOLCHAIN_FILE="${MIXXX_VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" -DCMAKE_SYSTEM_NAME=Android -DBUILD_TESTING=OFF -DBUILD_BENCH=OFF ..); then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Build APK only
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-android --target apk --parallel 2 --verbose 2>&1 | tee "$RUNNER_TEMP/android-apk-build.log"
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-build-log
          path: ${{ runner.temp }}/android-apk-build.log
          archive: true
          if-no-files-found: error
          retention-days: 14
      - name: Verify APK
        shell: bash
        run: |
          test -f build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          ls -lh build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-build-release-signed.apk
          path: build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
