name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
env:
  DEBIAN_FRONTEND: noninteractive
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Materialize NRave launcher artwork
        shell: bash
        run: |
          set -euo pipefail
          SRC="packaging/android/icon-source/ic_launcher.png.b64"
          DST_DIR="packaging/android/res/mipmap-xxxhdpi"
          DST="$DST_DIR/nrave_icon.png"
          mkdir -p "$DST_DIR"
          find "$DST_DIR" -type f -delete
          tr -d '\r\n\t ' < "$SRC" | base64 --decode > "$DST"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct, zlib
          p = Path("packaging/android/res/mipmap-xxxhdpi/nrave_icon.png")
          d = p.read_bytes()
          if not d.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("Invalid NRave launcher PNG signature")
          pos = 8
          seen_ihdr = seen_iend = False
          while pos < len(d):
              if pos + 12 > len(d):
                  raise SystemExit("Truncated PNG chunk header")
              n = struct.unpack(">I", d[pos:pos+4])[0]
              typ = d[pos+4:pos+8]
              endpos = pos + 12 + n
              if endpos > len(d):
                  raise SystemExit(f"Truncated PNG chunk {typ!r}")
              payload = d[pos+8:pos+8+n]
              crc = struct.unpack(">I", d[pos+8+n:endpos])[0]
              if (zlib.crc32(typ + payload) & 0xffffffff) != crc:
                  raise SystemExit(f"Invalid PNG CRC in {typ.decode('latin1')}")
              if typ == b"IHDR":
                  if n != 13:
                      raise SystemExit("Invalid IHDR length")
                  width, height, bit_depth, color_type, comp, filt, interlace = struct.unpack(">IIBBBBB", payload)
                  if (width, height) != (144, 144):
                      raise SystemExit(f"Launcher PNG must be 144x144, got {width}x{height}")
                  if comp != 0 or filt != 0:
                      raise SystemExit("Unsupported PNG compression/filter method")
                  seen_ihdr = True
              if typ == b"IEND":
                  if n != 0 or endpos != len(d):
                      raise SystemExit("Invalid PNG IEND/trailing data")
                  seen_iend = True
                  break
              pos = endpos
          if not seen_ihdr or not seen_iend:
              raise SystemExit("PNG missing IHDR or IEND")
          print(f"Validated NRave launcher artwork: {len(d)} bytes, 144x144, SHA-256 {hashlib.sha256(d).hexdigest()}")
          PY
          if find packaging/android/res -type f \( -name '*.b64' -o -name '*.part*' -o -name '*.webp' \) | grep -q .; then
            echo 'ERROR: source/helper files must not be present under packaging/android/res'
            exit 1
          fi
      - name: Persist recording button and storage fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          qml = Path("res/qml/MainWindow.qml")
          text = qml.read_text()
          old_record = '''                Skin.ControlButton {
                    id: recordButton

                    activeBackgroundColor: Theme.red
                    activeColor: Theme.white
                    group: "[Recording]"
                    highlight: recordingStatus.value >= 2
                    key: "toggle_recording"
                    text: "Record"
                    toggleable: true
                }
'''
          new_record = '''                Skin.ControlButton {
                    id: recordButton

                    activeBackgroundColor: recordingStatus.value >= 2 ? Theme.red : "#2D4EA1"
                    activeColor: Theme.white
                    displayKey: "status"
                    group: "[Recording]"
                    highlight: recordingStatus.value > 0
                    key: "toggle_recording"
                    text: "Record"
                    toggleable: false
                }
'''
          if old_record in text:
              text = text.replace(old_record, new_record, 1)
          elif new_record not in text:
              raise SystemExit("Record button block not found in expected state")
          # Use Qt-compatible string formatting instead of relying on padStart.
          old_format = 'return String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");'
          new_format = 'return (minutes < 10 ? "0" : "") + minutes + ":" + (seconds < 10 ? "0" : "") + seconds;'
          if old_format in text:
              text = text.replace(old_format, new_format, 1)
          qml.write_text(text)

          cpp = Path("src/recording/recordingmanager.cpp")
          text = cpp.read_text()
          old_dir = '''void RecordingManager::setRecordingDir() {
    QDir recordDir(m_pConfig->getValueString(
        ConfigKey(RECORDING_PREF_KEY, "Directory")));
'''
          new_dir = '''void RecordingManager::setRecordingDir() {
    QString recordingsPath = m_pConfig->getValueString(
        ConfigKey(RECORDING_PREF_KEY, "Directory"));
    if (recordingsPath.isEmpty()) {
        QString musicDir = QStandardPaths::writableLocation(QStandardPaths::MusicLocation);
        if (!musicDir.isEmpty()) {
            recordingsPath = QDir(musicDir).filePath("Mixxx/Recordings");
        } else {
            const QString appDataDir = QStandardPaths::writableLocation(QStandardPaths::AppDataLocation);
            if (!appDataDir.isEmpty()) {
                recordingsPath = QDir(appDataDir).filePath("Recordings");
            }
        }
        if (!recordingsPath.isEmpty()) {
            m_pConfig->set(ConfigKey(RECORDING_PREF_KEY, "Directory"), recordingsPath);
        }
    }

    QDir recordDir(recordingsPath);
'''
          if old_dir in text:
              text = text.replace(old_dir, new_dir, 1)
          cpp.write_text(text)
          PY

          git diff --check
          if ! git diff --quiet -- res/qml/MainWindow.qml src/recording/recordingmanager.cpp; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add res/qml/MainWindow.qml src/recording/recordingmanager.cpp
            git commit -m "fix: make recording control functional and initialize storage [skip ci]"
            git push origin HEAD:main
          fi
      - name: Prepare Android build environment
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get clean
          source ./tools/android_buildenv.sh setup
      - name: Create temporary signing key
        shell: bash
        run: |
          PASS="mixxx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          keytool -genkeypair -keystore "$RUNNER_TEMP/mixxx.keystore" -alias mixxx -keyalg RSA -keysize 2048 -validity 3650 -storepass "$PASS" -keypass "$PASS" -dname "CN=Mixxx Android Build"
          echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_KEY_PASS=$PASS" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_STORE_PASS=$PASS" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mixxx.keystore" >> "$GITHUB_ENV"
      - name: Configure Android
        shell: bash
        run: |
          set -o pipefail
          rm -rf build-android "${BUILDENV_BASEPATH}/${BUILDENV_NAME}"
          mkdir -p build-android
          for attempt in 1 2 3; do
            rm -rf "${BUILDENV_BASEPATH}/${BUILDENV_NAME}" build-android
            mkdir -p build-android
            if (cd build-android && cmake -DCMAKE_TOOLCHAIN_FILE="${MIXXX_VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" -DCMAKE_SYSTEM_NAME=Android -DBUILD_TESTING=OFF -DBUILD_BENCH=OFF ..); then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Build APK only
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-android --target apk --parallel 2 --verbose 2>&1 | tee "$RUNNER_TEMP/android-apk-build.log"
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-build-log
          path: ${{ runner.temp }}/android-apk-build.log
          archive: true
          if-no-files-found: error
          retention-days: 14
      - name: Verify APK
        shell: bash
        run: |
          test -f build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          ls -lh build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-build-release-signed.apk
          path: build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
