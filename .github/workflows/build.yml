name: Android APK
# CI validation is intentionally triggered by branch pushes for design work.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - experimental/modern-indicator-skin
      - experimental/modern-indicator-skin-2
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
env:
  DEBIAN_FRONTEND: noninteractive
jobs:
  validate-nrave-splash:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate canonical NRave splash artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path("res/images/nrave_splash.webp")
          data = p.read_bytes()
          expected = "5a0b11f7243c239695adcb5c3278d636ed167c44757c0399d547f3933aff9b4b"
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("NRave splash SHA-256 mismatch")
          if data[:4] != b"RIFF" or data[8:12] != b"WEBP":
              raise SystemExit("Invalid NRave splash WebP signature")

          manifest = Path("packaging/android/AndroidManifest.xml").read_text()
          for value in [
              'android.app.splash_screen_drawable',
              'android.app.splash_screen_drawable_landscape',
              'android.app.splash_screen_sticky',
              'android:resource="@drawable/nrave_splash"',
              'android:value="true"',
          ]:
              if value not in manifest:
                  raise SystemExit(f"Missing native Qt splash contract: {value}")

          qml = Path("res/qml/main.qml").read_text()
          if "nraveSplashCurtain" in qml or "qrc:/images/nrave_splash.webp" in qml:
              raise SystemExit("Redundant QML splash curtain/resource is still present")
          if "Mixxx.Core.hideAndroidSplashScreen(250)" not in qml:
              raise SystemExit("QML does not release the native splash after MainWindow readiness")

          print(f"PASS: canonical NRave splash + sticky native Qt splash contract validated ({len(data)} bytes)")
          PY

  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Materialize NRave launcher and splash artwork
        shell: bash
        run: |
          set -euo pipefail

          # --- NRave launcher icon ---
          SRC="packaging/android/icon-source/ic_launcher.png.b64"
          DST_DIR="packaging/android/res/mipmap-xxxhdpi"
          DST="$DST_DIR/nrave_icon.png"
          mkdir -p "$DST_DIR"
          find "$DST_DIR" -type f -delete
          tr -d '\r\n\t ' < "$SRC" | base64 --decode > "$DST"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct, zlib

          p = Path("packaging/android/res/mipmap-xxxhdpi/nrave_icon.png")
          d = p.read_bytes()
          if not d.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("Invalid NRave launcher PNG signature")
          pos = 8
          seen_ihdr = seen_iend = False
          while pos < len(d):
              if pos + 12 > len(d):
                  raise SystemExit("Truncated PNG chunk header")
              n = struct.unpack(">I", d[pos:pos+4])[0]
              typ = d[pos+4:pos+8]
              endpos = pos + 12 + n
              if endpos > len(d):
                  raise SystemExit(f"Truncated PNG chunk {typ!r}")
              payload = d[pos+8:pos+8+n]
              crc = struct.unpack(">I", d[pos+8+n:endpos])[0]
              if (zlib.crc32(typ + payload) & 0xffffffff) != crc:
                  raise SystemExit(f"Invalid PNG CRC in {typ.decode('latin1')}")
              if typ == b"IHDR":
                  if n != 13:
                      raise SystemExit("Invalid IHDR length")
                  width, height, _, _, comp, filt, _ = struct.unpack(">IIBBBBB", payload)
                  if (width, height) != (144, 144):
                      raise SystemExit(f"Launcher PNG must be 144x144, got {width}x{height}")
                  if comp != 0 or filt != 0:
                      raise SystemExit("Unsupported PNG compression/filter method")
                  seen_ihdr = True
              if typ == b"IEND":
                  if n != 0 or endpos != len(d):
                      raise SystemExit("Invalid PNG IEND/trailing data")
                  seen_iend = True
                  break
              pos = endpos
          if not seen_ihdr or not seen_iend:
              raise SystemExit("PNG missing IHDR or IEND")
          print(f"Validated NRave launcher artwork: {len(d)} bytes, 144x144, SHA-256 {hashlib.sha256(d).hexdigest()}")
          PY

          # --- NRave native Qt splash ---
          SPLASH_SRC="res/images/nrave_splash.webp"
          SPLASH_DIR="packaging/android/res/drawable"
          SPLASH_DST="$SPLASH_DIR/nrave_splash.webp"
          mkdir -p "$SPLASH_DIR"
          rm -f "$SPLASH_DST"
          cp "$SPLASH_SRC" "$SPLASH_DST"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("packaging/android/res/drawable/nrave_splash.webp")
          d = p.read_bytes()
          expected = "5a0b11f7243c239695adcb5c3278d636ed167c44757c0399d547f3933aff9b4b"
          if hashlib.sha256(d).hexdigest() != expected:
              raise SystemExit("Android splash artwork differs from canonical NRave artwork")
          if d[:4] != b"RIFF" or d[8:12] != b"WEBP":
              raise SystemExit("Invalid NRave splash WebP signature")
          print(f"Validated NRave native splash drawable: {len(d)} bytes, SHA-256 {expected}")
      - name: Prepare Android build environment
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get clean
          source ./tools/android_buildenv.sh setup
      - name: Create temporary signing key
        shell: bash
        run: |
          PASS="mixxx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          keytool -genkeypair -keystore "$RUNNER_TEMP/mixxx.keystore" -alias mixxx -keyalg RSA -keysize 2048 -validity 3650 -storepass "$PASS" -keypass "$PASS" -dname "CN=Mixxx Android Build"
          echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_KEY_PASS=$PASS" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_STORE_PASS=$PASS" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mixxx.keystore" >> "$GITHUB_ENV"
      - name: Configure Android
        shell: bash
        run: |
          set -o pipefail
          rm -rf build-android "${BUILDENV_BASEPATH}/${BUILDENV_NAME}"
          mkdir -p build-android
          for attempt in 1 2 3; do
            rm -rf "${BUILDENV_BASEPATH}/${BUILDENV_NAME}" build-android
            mkdir -p build-android
            if (cd build-android && cmake -DCMAKE_TOOLCHAIN_FILE="${MIXXX_VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" -DCMAKE_SYSTEM_NAME=Android -DBUILD_TESTING=OFF -DBUILD_BENCH=OFF ..); then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Build APK only
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-android --target apk --parallel 2 --verbose 2>&1 | tee "$RUNNER_TEMP/android-apk-build.log"
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-build-log
          path: ${{ runner.temp }}/android-apk-build.log
          archive: true
          if-no-files-found: error
          retention-days: 14
      - name: Verify APK
        shell: bash
        run: |
          test -f build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          ls -lh build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk

      - name: Test NRave native splash package
        shell: bash
        run: |
          set -euo pipefail
          APK="build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk"
          EXPECTED="5a0b11f7243c239695adcb5c3278d636ed167c44757c0399d547f3933aff9b4b"

          SPLASH_ENTRY=""
          while read -r entry; do
            actual="$(unzip -p "$APK" "$entry" | sha256sum | cut -d ' ' -f1)"
            if [ "$actual" = "$EXPECTED" ]; then
              SPLASH_ENTRY="$entry"
              break
            fi
          done < <(unzip -Z1 "$APK" | grep -E '^res/[^/]+/[^/]+\\.(webp|png)$')

          if [ -z "$SPLASH_ENTRY" ]; then
            echo "Exact NRave splash artwork was not found in APK resources"
            exit 1
          fi
          echo "Found canonical NRave splash artwork at $SPLASH_ENTRY"

          unzip -p "$APK" "$SPLASH_ENTRY" > "$RUNNER_TEMP/nrave_splash_from_apk.webp"
          ACTUAL="$(sha256sum "$RUNNER_TEMP/nrave_splash_from_apk.webp" | cut -d ' ' -f1)"
          test "$ACTUAL" = "$EXPECTED"

          unzip -p "$APK" "assets/qml/main.qml" > "$RUNNER_TEMP/nrave_main.qml"
          ! grep -q 'nraveSplashCurtain' "$RUNNER_TEMP/nrave_main.qml"
          grep -q 'Mixxx.Core.hideAndroidSplashScreen(250)' "$RUNNER_TEMP/nrave_main.qml"

          echo "PASS: Android APK contains the exact NRave native splash and only the native release path"

      - name: Print source and APK identity
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_COMMIT=${GITHUB_SHA}"
          sha256sum build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nrave-android-${{ github.sha }}
          path: build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
 | while read -r entry; do
            unzip -p "$APK" "$entry" | sha256sum | awk -v e="$EXPECTED" '$1 == e { print ENVIRON["entry"]; exit }'
          done)"
          if [ -z "$SPLASH_ENTRY" ]; then
            echo "Exact NRave splash artwork was not found in APK resources"
            exit 1
          fi
          echo "Found canonical NRave splash artwork at $SPLASH_ENTRY"

          unzip -p "$APK" "$SPLASH_ENTRY" > "$RUNNER_TEMP/nrave_splash_from_apk.webp"
          ACTUAL="$(sha256sum "$RUNNER_TEMP/nrave_splash_from_apk.webp" | cut -d ' ' -f1)"
          test "$ACTUAL" = "$EXPECTED"

          unzip -p "$APK" "assets/qml/main.qml" > "$RUNNER_TEMP/nrave_main.qml"
          ! grep -q 'nraveSplashCurtain' "$RUNNER_TEMP/nrave_main.qml"
          grep -q 'Mixxx.Core.hideAndroidSplashScreen(250)' "$RUNNER_TEMP/nrave_main.qml"

          echo "PASS: Android APK contains the exact NRave native splash and only the native release path"
      - name: Print source and APK identity
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_COMMIT=${GITHUB_SHA}"
          sha256sum build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nrave-android-${{ github.sha }}
          path: build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
