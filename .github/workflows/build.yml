name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
env:
  DEBIAN_FRONTEND: noninteractive
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Materialize and verify exact NRave launcher artwork
        shell: bash
        run: |
          set -euo pipefail
          SRC_DIR="packaging/android/icon-source"
          DST_DIR="packaging/android/res/mipmap-xxhdpi"
          DST="$DST_DIR/nrave_icon.webp"
          mkdir -p "$DST_DIR"
          : > "$DST"
          for part in "$SRC_DIR"/nrave_icon_144.webp.b64.part*; do
            test -s "$part"
            printf 'Decoding %s (%s bytes)\n' "$(basename "$part")" "$(wc -c < "$part")"
            base64 --decode "$part" >> "$DST"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("packaging/android/res/mipmap-xxhdpi/nrave_icon.webp")
          d = p.read_bytes()
          if not (d.startswith(b"RIFF") and d[8:12] == b"WEBP"):
              raise SystemExit("Invalid NRave launcher WebP")
          expected = "7a6215ce5cdbc63e02977d7c4ae5e14386403e532bfff0258caf0a8a7afa1183"
          actual = hashlib.sha256(d).hexdigest()
          if actual != expected:
              raise SystemExit(f"NRave launcher artwork mismatch: expected {expected}, got {actual}")
          print(f"Verified exact lossless NRave launcher artwork: {len(d)} bytes, SHA-256 {actual}")
          PY
      - name: Prepare Android build environment
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get clean
          source ./tools/android_buildenv.sh setup
      - name: Create temporary signing key
        shell: bash
        run: |
          PASS="mixxx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          keytool -genkeypair -keystore "$RUNNER_TEMP/mixxx.keystore" -alias mixxx -keyalg RSA -keysize 2048 -validity 3650 -storepass "$PASS" -keypass "$PASS" -dname "CN=Mixxx Android Build"
          echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_KEY_PASS=$PASS" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_STORE_PASS=$PASS" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mixxx.keystore" >> "$GITHUB_ENV"
      - name: Configure Android
        shell: bash
        run: |
          set -o pipefail
          rm -rf build-android "${BUILDENV_BASEPATH}/${BUILDENV_NAME}"
          mkdir -p build-android
          for attempt in 1 2 3; do
            rm -rf "${BUILDENV_BASEPATH}/${BUILDENV_NAME}" build-android
            mkdir -p build-android
            if (cd build-android && cmake -DCMAKE_TOOLCHAIN_FILE="${MIXXX_VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" -DCMAKE_SYSTEM_NAME=Android -DBUILD_TESTING=OFF -DBUILD_BENCH=OFF ..); then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Build APK only
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-android --target apk --parallel 2 --verbose 2>&1 | tee "$RUNNER_TEMP/android-apk-build.log"
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-build-log
          path: ${{ runner.temp }}/android-apk-build.log
          archive: true
          if-no-files-found: error
          retention-days: 14
      - name: Verify APK
        shell: bash
        run: |
          test -f build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          ls -lh build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-build-release-signed.apk
          path: build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
